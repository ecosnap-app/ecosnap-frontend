name: CI

# Se ejecuta en cada push a main y en cada Pull Request.
# Así queda registrado en GitHub que el código de cada historia de usuario
# compila antes de hacer merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Compilar y verificar tipos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Verificar tipos de TypeScript
        run: npx tsc --noEmit

      - name: Correr las pruebas automatizadas
        run: npm run test:ci

      - name: Compilar el bundle de Android
        run: npx expo export --platform android --output-dir dist
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Guardar el bundle como evidencia
        uses: actions/upload-artifact@v4
        with:
          name: bundle-android
          path: dist
          retention-days: 14
